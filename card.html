<style>
  :root{
    --ink:#16161A;
    --paper:#F7F5F0;
    --brass:#C9A24A;
    --muted:#8C8A86;
    --serif: Fraunces, "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    background-image:radial-gradient(120% 80% at 50% 0%, #23232B 0%, #16161A 62%);
    color:var(--paper);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 24px);
  }
  .card{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:22px}
  .logo{width:72%;max-width:280px;height:auto;display:block}
  .tag{
    font-family:var(--serif);
    font-style:italic;
    font-size:15px;
    color:var(--brass);
    margin:-8px 0 0;
    letter-spacing:.01em;
  }
  /* Two codes side by side; only one shows at a time. Swipe, or tap a dot. */
  .deck{width:100%;max-width:340px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
  .deck::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
  .dots{display:flex;gap:10px;justify-content:center;margin:-8px 0 -4px}
  .dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:#3A3A42;cursor:pointer;transition:background .2s ease,transform .2s ease}
  .dot.on{background:var(--brass);transform:scale(1.15)}
  .dot:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
  .board{width:100%;border:0;background:none;padding:0;cursor:pointer;display:block}
  .board svg{width:100%;height:auto;display:block}
  .board:focus-visible{outline:2px solid var(--brass);outline-offset:6px;border-radius:6px}
  .scanline{font-size:14px;color:var(--muted);text-align:center;margin:-6px 0 0}
  .actions{width:100%;display:flex;flex-direction:column;gap:11px}
  .btn{
    font-family:var(--sans);
    font-size:16px;
    font-weight:600;
    padding:16px 18px;
    border-radius:2px;
    text-align:center;
    text-decoration:none;
    display:block;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn-main{background:var(--paper);color:var(--ink)}
  .btn-main:active{background:var(--brass)}
  .btn-ghost{background:transparent;color:var(--paper);border-color:#3A3A42;font-weight:500}
  .btn-ghost:active{border-color:var(--brass);color:var(--brass)}
  .btn:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
  .foot{
    text-align:center;
    font-size:12.5px;
    line-height:1.7;
    color:var(--muted);
    margin-top:auto;
    padding-top:20px;
  }
  .foot a{color:var(--muted);text-decoration:none;border-bottom:1px solid #3A3A42}
  .zoom{position:fixed;inset:0;background:#FFFFFF;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}
  .zoom.on{display:flex}
  .zoom svg{width:100%;max-width:min(92vw,92vh);height:auto}
  .zoom .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:0;right:0;text-align:center;font-size:13px;color:#8C8A86}
  .fade{animation:rise .55s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.fade{animation:none}}
</style>
</head>

        ^ EXP_TABLE[i - 6]

      while (n < 0) {

      while (n >= 256) {

<script>
(function () {
  var board = document.getElementById('board');
  var deck = document.getElementById('deck');
  var scan = document.getElementById('scanline');
  var dots = [].slice.call(document.querySelectorAll('.dot'));
  var zc1 = document.getElementById('zoomcode'), zc2 = document.getElementById('zoomcode2');
  var LINES = ['Point a camera here to open the catalogue', 'Point a camera here to open Instagram'];
  var cur = 0;
  var zoom = document.getElementById('zoom');
  var open = document.getElementById('open');
  var copy = document.getElementById('copy');
  var share = document.getElementById('share');

  // The two code pictures are already drawn into this file, so they show even
  // if scripts are switched off. Redraw only when the address was changed.
  if (PORTFOLIO_URL !== BAKED_URL) {
    try {
      board.innerHTML = buildSvg(PORTFOLIO_URL, { art: true });
      document.getElementById('zoomcode').innerHTML = buildSvg(PORTFOLIO_URL, { art: false });
      open.href = PORTFOLIO_URL;
    } catch (e) {
      board.innerHTML = '<p style="color:#C9A24A;font-size:14px;line-height:1.6">The code could not be drawn. Check the address in PORTFOLIO_URL near the bottom of this file.</p>';
    }
  }

  function setCur(i) {
    cur = i;
    scan.textContent = LINES[i];
    dots.forEach(function (d, k) { d.classList.toggle('on', k === i); d.setAttribute('aria-selected', k === i ? 'true' : 'false'); });
  }
  var tick = null;
  deck.addEventListener('scroll', function () {
    if (tick) return;
    tick = requestAnimationFrame(function () {
      tick = null;
      var i = Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth));
      if (i !== cur) setCur(Math.max(0, Math.min(1, i)));
    });
  }, { passive: true });
  dots.forEach(function (d, k) {
    d.addEventListener('click', function () { deck.scrollTo({ left: k * deck.clientWidth, behavior: 'smooth' }); setCur(k); });
  });
  [].slice.call(document.querySelectorAll('.board')).forEach(function (b) {
    b.addEventListener('click', function () {
      zc1.hidden = cur !== 0; zc2.hidden = cur !== 1;
      zoom.classList.add('on');
    });
  });
  zoom.addEventListener('click', function () { zoom.classList.remove('on'); });

  copy.addEventListener('click', function () {
    var done = function () {
      copy.textContent = 'Link copied';
      setTimeout(function () { copy.textContent = 'Copy link'; }, 1800);
    };
    function fallback() {
      var t = document.createElement('textarea');
      t.value = PORTFOLIO_URL;
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { copy.textContent = 'Copy failed'; }
      document.body.removeChild(t);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(PORTFOLIO_URL).then(done, fallback);
    } else { fallback(); }
  });

  if (navigator.share) {
    share.hidden = false;
    share.addEventListener('click', function () {
      navigator.share({ title: 'Jado String Art', url: PORTFOLIO_URL }).catch(function () {});
    });
  }
})();
</script>
</body>
